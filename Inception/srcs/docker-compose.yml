services:
  nginx:
    restart: always
    container_name: nginx
    build: ./requirements/nginx
    ports:
      - 443:443
    networks:
      - docker-network
    volumes:
      - wordpress-data:/var/www/html

  wordpress:
    restart: always
    container_name: wordpress
    build: ./requirements/wordpress
    depends_on:
      - mariadb
    expose:
      - 9000
    environment:
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_ADMIN: ${WORDPRESS_ADMIN}
      WORDPRESS_MAIL_ADMIN: ${WORDPRESS_MAIL_ADMIN}
      WORDPRESS_USER: ${WORDPRESS_USER}
      WORDPRESS_MAIL_USER: ${WORDPRESS_MAIL_USER}
    volumes:
      - wordpress-data:/var/www/html
    networks:
      - docker-network
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password

  mariadb:
    restart: always
    build: ./requirements/mariadb
    container_name: mariadb
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - docker-network
    secrets:
      - db_root_password
      - db_password

networks:
  docker-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ahalifa/data/mysql
  wordpress-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ahalifa/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt